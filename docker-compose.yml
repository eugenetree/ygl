x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
  POSTGRES_DB: ${POSTGRES_DB:-saythis}
  DB_HOST: db
  DB_PORT: 5432

# The in-network Elasticsearch address, referenced by both our app services
# (as ES_NODE) and Kibana (as ELASTICSEARCH_HOSTS).
x-es-url: &es-url http://elasticsearch:9200

x-es-env: &es-env
  ES_NODE: *es-url

x-telegram-env: &telegram-env
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

services:
  # ── 1. PostgreSQL Database ──────────────────────────────────────────────────
  db:
    container_name: db
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-saythis}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-saythis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 2. Elasticsearch ───────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      # Mapping form (not `- KEY=value`) so the *es-url alias resolves;
      # YAML aliases are not expanded inside sequence strings.
      ELASTICSEARCH_HOSTS: *es-url
    depends_on:
      - elasticsearch

  # ── 3. Application Services (Shared Image) ──────────────────────────────────
  # All three share saythis-app:latest and declare the same build, so any one
  # of them can be built or started on its own. Compose de-duplicates identical
  # builds, so the image is still built only once.
  bot:
    container_name: bot
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.dev}
    image: saythis-app:latest
    environment:
      # Postgres is both the store and the bot<->scraper control channel
      # (LISTEN/NOTIFY), so the DB vars are load-bearing here.
      <<: [*db-env, *es-env, *telegram-env]
    volumes:
      - ${LOGS_DIR:-./logs}:/usr/src/app/logs
    command: npm run start:bot
    depends_on:
      db:
        condition: service_healthy

  sync-elastic:
    container_name: sync-elastic
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.dev}
    image: saythis-app:latest
    environment:
      <<: [*db-env, *es-env]
    command: npm run start:elastic
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  api:
    container_name: api
    build:
      context: .
      dockerfile: ${DOCKERFILE:-Dockerfile.dev}
    image: saythis-app:latest
    environment:
      # Reads from Elasticsearch only — never touches Postgres.
      <<: *es-env
      IS_API_ENABLED: ${IS_API_ENABLED:-}
    ports:
      - "127.0.0.1:3001:3001"
    command: npm run start:api
    depends_on:
      elasticsearch:
        condition: service_started

  # ── 4. VPN Scraper (Special Image) ─────────────────────────────────────────
  scraper:
    container_name: scraper
    build:
      context: .
      dockerfile: Dockerfile.scraper
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      <<: [*db-env, *telegram-env]
      # Selects the seed word list: "development" -> dev.json, else prod.json
      APP_ENV: ${APP_ENV:-}
      VPN_USER: ${VPN_USER}
      VPN_PASS: ${VPN_PASS}
      VPN_CONFIG_B64: ${VPN_CONFIG_B64}
      YTDLP_COOKIES_B64: ${YTDLP_COOKIES_B64:-}
    volumes:
      - ${LOGS_DIR:-./logs}:/usr/src/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local
