# ── Shared environment blocks ───────────────────────────────────────────────
x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?set it in .env — see .env.example}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env — see .env.example}
  POSTGRES_DB: ${POSTGRES_DB:?set it in .env — see .env.example}
  DB_HOST: db
  DB_PORT: 5432

x-es-env: &es-env
  ES_NODE: http://elasticsearch:9200

x-telegram-env: &telegram-env
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set it in .env — see .env.example}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set it in .env — see .env.example}

services:
  # ── 1. PostgreSQL Database ──────────────────────────────────────────────────
  db:
    container_name: db
    image: postgres:18-alpine
    restart: always
    environment: *postgres-env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      # CMD-SHELL takes a string, which cannot reference an anchor.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set it in .env} -d ${POSTGRES_DB:?set it in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 2. Elasticsearch ───────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

  # ── 3. Migrations ───────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: saythis-app:latest
    environment: *postgres-env
    command: node dist/src/db/scripts/run-migrations.js
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # ── 4. Application Services (Shared Image) ──────────────────────────────────
  bot:
    container_name: bot
    image: saythis-app:latest
    environment:
      # Elasticsearch because the bot's /find and /resync commands search captions
      <<: [*postgres-env, *es-env, *telegram-env]
    command: npm run start:bot
    depends_on:
      migrate:
        condition: service_completed_successfully

  sync-elastic:
    container_name: sync-elastic
    image: saythis-app:latest
    environment:
      <<: [*postgres-env, *es-env]
    command: npm run start:elastic
    depends_on:
      migrate:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_started

  api:
    container_name: api
    image: saythis-app:latest
    environment:
      <<: *es-env
      IS_API_ENABLED: ${IS_API_ENABLED:-}
    ports:
      - "127.0.0.1:3001:3001"
    command: npm run start:api
    depends_on:
      elasticsearch:
        condition: service_started

  # ── 5. VPN Scraper (Special Image) ─────────────────────────────────────────
  scraper:
    container_name: scraper
    build:
      context: .
      dockerfile: Dockerfile.scraper
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      <<: [*postgres-env, *telegram-env]
      APP_ENV: ${APP_ENV:-}
      VPN_USER: ${VPN_USER:-}
      VPN_PASS: ${VPN_PASS:-}
      VPN_CONFIG_B64: ${VPN_CONFIG_B64:-}
      YTDLP_COOKIES_B64: ${YTDLP_COOKIES_B64:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local
